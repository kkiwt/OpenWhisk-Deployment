# Apache OpenWhisk - Multi-Cluster NGINX Gateway
# Public Gateway: server1 (103.82.37.47)
# Private network: 192.168.1.0/24
#
# Architecture:
#   Client -> Public NGINX :8081 -> Global LB (Round Robin)
#                                      |-> C1 internal gateway :18081
#                                      |-> C2 internal gateway :18082
#   Each cluster gateway -> NodePort backends (Least Connections)
#


upstream ow_k3s_cloud {
    least_conn;

    # C1 BACKEND - 4 NODES
    server 192.168.1.102:31001 max_fails=3 fail_timeout=10s;
    server 192.168.1.46:31001  max_fails=3 fail_timeout=10s;
    server 192.168.1.242:31001 max_fails=3 fail_timeout=10s;
    server 192.168.1.5:31001   max_fails=3 fail_timeout=10s;
    keepalive 64;
}

upstream ow_k3s_c2 {
    least_conn;

    # C2 BACKEND - 4 NODES
    server 192.168.1.93:31001  max_fails=3 fail_timeout=10s;
    server 192.168.1.154:31001 max_fails=3 fail_timeout=10s;
    server 192.168.1.161:31001 max_fails=3 fail_timeout=10s;
    server 192.168.1.90:31001  max_fails=3 fail_timeout=10s;

    keepalive 64;
}

upstream ow_global_clusters {
    # NGINX default algorithm: Round Robin
    server 127.0.0.1:18081 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:18082 max_fails=3 fail_timeout=10s;

    keepalive 32;
}

# ---------------------------------------------------------------------------
# Public gateway
# ---------------------------------------------------------------------------
server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    access_log /var/log/nginx/ow-k3s-cloud.access.log;
    error_log  /var/log/nginx/ow-k3s-cloud.error.log warn;

    client_max_body_size 20m;

    # Lightweight gateway health endpoint.
    location = /healthz {
        default_type text/plain;
        access_log off;
        return 200 "ok\n";
    }

    # Invoke an Action on C1 (namespace: guest).
    location ~ ^/invoke/([A-Za-z0-9_-]+)$ {
        rewrite ^/invoke/([A-Za-z0-9_-]+)$ /api/v1/namespaces/guest/actions/$1?blocking=true&result=true break;

        proxy_pass https://ow_k3s_cloud;
        include /etc/nginx/ow-cloud-auth.conf;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_verify off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # Invoke an Action on C2 (namespace: Group4).
    location ~ ^/c2/invoke/([A-Za-z0-9_-]+)$ {
        rewrite ^/c2/invoke/([A-Za-z0-9_-]+)$ /api/v1/namespaces/Group4/actions/$1?blocking=true&result=true break;

        proxy_pass https://ow_k3s_c2;
        include /etc/nginx/ow-c2-auth.conf;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_verify off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # Global entry point: Round Robin between C1 and C2.
    location ~ ^/global/invoke/([A-Za-z0-9_-]+)$ {
        rewrite ^/global/invoke/([A-Za-z0-9_-]+)$ /invoke/$1 break;

        proxy_pass http://ow_global_clusters;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # Reject unknown paths.
    location / {
        default_type text/plain;
        return 404 "Not Found\n";
    }
}

# ---------------------------------------------------------------------------
# Internal gateway for C1
# Bound to loopback only; not exposed to the public network.
# ---------------------------------------------------------------------------
server {
    listen 127.0.0.1:18081;
    server_name _;

    location ~ ^/invoke/([A-Za-z0-9_-]+)$ {
        rewrite ^/invoke/([A-Za-z0-9_-]+)$ /api/v1/namespaces/guest/actions/$1?blocking=true&result=true break;

        proxy_pass https://ow_k3s_cloud;
        include /etc/nginx/ow-cloud-auth.conf;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_ssl_verify off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    location / {
        default_type text/plain;
        return 404 "Not Found\n";
    }
}

# ---------------------------------------------------------------------------
# Internal gateway for C2
# Bound to loopback only; not exposed to the public network.
# ---------------------------------------------------------------------------
server {
    listen 127.0.0.1:18082;
    server_name _;

    location ~ ^/invoke/([A-Za-z0-9_-]+)$ {
        rewrite ^/invoke/([A-Za-z0-9_-]+)$ /api/v1/namespaces/Group4/actions/$1?blocking=true&result=true break;

        proxy_pass https://ow_k3s_c2;
        include /etc/nginx/ow-c2-auth.conf;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_ssl_verify off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    location / {
        default_type text/plain;
        return 404 "Not Found\n";
    }
}
