apiVersion: v1
kind: LimitRange
metadata:
  name: openwhisk-default-limits
spec:
  limits:
    - type: Container
      default:
        memory: 128Mi
        cpu: 500m
      defaultRequest:
        memory: 64Mi
        cpu: 50m
      max:
        memory: 2048Mi
        cpu: "1"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: openwhisk-safety-quota
spec:
  hard:
    requests.memory: 10Gi
    limits.memory: 16Gi
    requests.cpu: "8"
    limits.cpu: "20"
    pods: "60"
