# =====================================================================
#  nginx-upstream.conf - điểm vào HTTP cho cụm K3s trong private VPC
#  Đặt ở /etc/nginx/conf.d/ow-k3s-cloud.conf trên máy làm Gateway/edge.
#
#  Giữ NGUYÊN hợp đồng /invoke/<action> của Gateway FastAPI -> K6 (tests/load-test.js)
#  trỏ vào đây mà không cần sửa kịch bản.
#
#  Thay 3 chỗ giữ chỗ bằng IP private thật (lấy từ `kubectl get nodes -o wide`):
#    sed -e 's/WORKER1_VPC_IP/10.0.0.11/' -e 's/WORKER2_VPC_IP/10.0.0.12/' -e 's/MASTER_VPC_IP/10.0.0.10/' \
#        gateway/nginx-upstream.conf | sudo tee /etc/nginx/conf.d/ow-k3s-cloud.conf
#  Chép gateway/ow-cloud-auth.conf (do deploy-actions.sh sinh) vào /etc/nginx/ow-cloud-auth.conf,
#  chmod 600: chứa khóa guest nên không đưa vào file cấu hình chính.
# =====================================================================

upstream ow_k3s_cloud {
    # least_conn thay vì round-robin: action A3 (0,5s) và A1 (0,05s) tốn thời gian rất khác nhau;
    # chia đều theo số request sẽ dồn container bận vào một worker, least_conn tự cân bằng.
    least_conn;

    # NodePort 31001 mở trên MỌI node nhờ kube-proxy: request vào server hoặc agent đều tới được
    # pod nginx của OpenWhisk. Hỏng 3 lần liên tiếp thì node nghỉ 10 giây.
    server WORKER1_VPC_IP:31001 max_fails=3 fail_timeout=10s;
    server WORKER2_VPC_IP:31001 max_fails=3 fail_timeout=10s;
    server MASTER_VPC_IP:31001 max_fails=3 fail_timeout=10s;

    # Giữ sẵn kết nối TLS tới cụm để giảm độ trễ khi gọi action
    # và làm méo số đo độ trễ.
    keepalive 64;
}

server {
    listen 8081;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # /invoke/A1 -> /api/v1/namespaces/_/actions/A1?blocking=true&result=true (đúng cách gateway.py gọi)
    location ~ ^/invoke/[A-Za-z0-9_-]+$ {
        limit_except POST { deny all; }
        include /etc/nginx/ow-cloud-auth.conf;
        rewrite ^/invoke/([A-Za-z0-9_-]+)$ /api/v1/namespaces/_/actions/$1?blocking=true&result=true break;

        proxy_pass https://ow_k3s_cloud;
        # Bắt buộc cho keepalive tới upstream: HTTP/1.1 và xóa header Connection.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Cert nginx của OpenWhisk là tự ký (mặc định đã off, ghi rõ để người sau khỏi nghi ngờ).
        proxy_ssl_verify off;

        proxy_connect_timeout 3s;   # nhanh chóng bỏ nhịp khi worker mất (F2/F3/F4) rồi chuyển sang server kế
        proxy_send_timeout    10s;
        proxy_read_timeout    65s;  # blocking=true của OpenWhisk chờ tối đa ~60s (gọi lạnh có thể 10-20s)

        # Failover khi worker chết. `non_idempotent` cho phép thử lại cả POST: CHỈ an toàn vì A1-A3 là hàm
        # thuần (tính toán, không ghi trạng thái). Đừng bật cho action có tác dụng phụ.
        proxy_next_upstream error timeout http_502 http_503 non_idempotent;
        proxy_next_upstream_tries 2;
    }
}
