apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: owdev-invoker-hpa
  namespace: openwhisk
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: owdev-invoker

  minReplicas: 2
  maxReplicas: 3

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 30

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
