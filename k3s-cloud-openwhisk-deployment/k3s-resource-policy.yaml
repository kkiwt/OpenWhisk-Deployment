apiVersion: v1
kind: LimitRange
metadata:
  name: openwhisk-default-limits
spec:
  limits:
    - type: Container
      default:
        memory: 128Mi
        cpu: 250m
      defaultRequest:
        memory: 64Mi
        cpu: 50m
      max:
        memory: 2048Mi
        cpu: "1"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: openwhisk-safety-quota
spec:
  hard:
    requests.memory: 6500Mi
    limits.memory: 8000Mi
    requests.cpu: "5"
    limits.cpu: "8"
    pods: "45"
