
# =====================================================================
# custom-values.yaml - OpenWhisk trên cụm K3s VPC
#
# Topology:
#   c1-server  : core
#   c1-agent1  : invoker
#   c1-agent2  : invoker
#   c1-agent3  : invoker
#
# Thành phần:
#   Controller : 1
#   Invoker    : 2
#   Kafka      : 1
#   ZooKeeper  : 1
#   CouchDB    : 1
#   Redis      : 1
#
# Storage:
#   local-path, PVC bật.
# =====================================================================

# ---------------------------------------------------------------------
# Gateway và API
# ---------------------------------------------------------------------

whisk:
  ingress:
    type: NodePort
    apiHostName: ""
    apiHostPort: 31001
    apiHostProto: "https"

  limits:
    actionsInvokesPerminute: 600000
    actionsInvokesConcurrent: 5000
    triggersFiresPerminute: 600000

    actions:
      memory:
        std: "128m"

  containerPool:
    userMemory: "1024m"

# ---------------------------------------------------------------------
# Persistence
# ---------------------------------------------------------------------

k8s:
  persistence:
    enabled: true
    hasDefaultStorageClass: true
    explicitStorageClass: null

# ---------------------------------------------------------------------
# Image
# ---------------------------------------------------------------------

utility:
  imageName: "openwhisk/ow-utils"
  imageTag: "ef725a6"

zookeeper:
  imageName: "zookeeper"
  imageTag: "3.4"
  replicaCount: 1

kafka:
  imageName: "wurstmeister/kafka"
  imageTag: "2.12-2.3.1"
  replicaCount: 1

db:
  imageName: "apache/couchdb"
  imageTag: "2.3"

nginx:
  imageName: "nginx"
  imageTag: "1.21.1"
  httpsNodePort: 31001

controller:
  imageName: "openwhisk/controller"
  imageTag: "ef725a6"
  jvmHeapMB: "768"

invoker:
  imageName: "openwhisk/invoker"
  imageTag: "ef725a6"
  jvmHeapMB: "512"

  containerFactory:
    impl: "kubernetes"

    kubernetes:
      replicaCount: 2

  kubernetes:
    replicaCount: 2

apigw:
  imageName: "openwhisk/apigateway"
  imageTag: "1.0.0"

redis:
  imageName: "redis"
  imageTag: "4.0"

busybox:
  imageName: "busybox"
  imageTag: "1.36.1"

# ---------------------------------------------------------------------
# Affinity
#
# Giữ vai trò node đã được cấu hình trên cụm.
# Không gắn Server vào nhóm Invoker.
# Không thay đổi taint của node.
# ---------------------------------------------------------------------

affinity:
  enabled: true
  coreNodeLabel: core
  invokerNodeLabel: invoker
  edgeNodeLabel: edge
  providerNodeLabel: provider
